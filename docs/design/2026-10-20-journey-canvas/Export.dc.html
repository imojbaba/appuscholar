<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export project</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4c1d95}a:hover{color:#3b0764}
</style>
</helmet>
<div style="min-height: 860px; background: #ece9f1; color: #2a2438; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; justify-content: center; align-items: flex-start; padding: 48px 16px; box-sizing: border-box">

<div role="dialog" aria-labelledby="exp-h" style="width: 100%; max-width: 760px; background: #ffffff; border: 1px solid #ddd9e4; border-radius: 16px; box-shadow: 0 16px 48px rgba(76, 29, 149, 0.16); padding: 28px 32px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px">
<div>
<h1 id="exp-h" style="margin: 0; font-size: 22px">Export: Sleep and exam anxiety</h1>
<p style="margin: 4px 0 0; font-size: 14px; color: #6b6579">Unlocked in your browser and saved to your computer. The files are readable, so keep them somewhere safe.</p>
</div>
<button aria-label="Close" style="width: 40px; height: 40px; border: 1px solid #ddd9e4; border-radius: 8px; background: #ffffff; color: #2a2438; font: inherit">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<fieldset style="border: 1px solid #ece8f2; border-radius: 12px; padding: 8px 18px 14px; margin: 0">
<legend style="padding: 0 6px; font-weight: 600">What to include</legend>
<sc-for list="{{items}}" as="i" hint-placeholder-count="8">
<label style="display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1eef5">
<input type="checkbox" checked>
<span><strong>{{i.name}}</strong><br><span style="font-size: 13px; color: #6b6579">{{i.detail}}</span></span>
<span style="font-size: 13px; color: #6b6579">{{i.format}}</span>
</label>
</sc-for>
</fieldset>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
<span style="font-size: 14px; color: #6b6579">One zip file, about [size].</span>
<div style="display: flex; gap: 10px">
<button style="height: 44px; padding: 0 16px; border: 1px solid #ddd9e4; border-radius: 8px; background: #ffffff; color: #2a2438; font: inherit">Cancel</button>
<button style="height: 44px; padding: 0 20px; border: none; border-radius: 8px; background: #4c1d95; color: #ffffff; font: inherit; font-weight: 700">Download zip</button>
</div>
</div>
<p style="margin: 0; font-size: 13px; color: #6b6579">To take every project at once, or to leave Appuscholar, use Account, Export all my work.</p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { name: 'Documents', detail: 'My first document, and every other document in this project', format: 'Word and HTML' },
        { name: 'Your question and feasibility read', detail: 'The project card and the last AI read', format: 'Text' },
        { name: 'Citations', detail: '4 sources, with the reference list in your chosen style', format: 'RIS, BibTeX, text' },
        { name: 'Search lists', detail: 'Papers you searched and kept, with quick reads', format: 'CSV' },
        { name: 'Reading notes', detail: 'Highlights, your own summaries and AI summaries, marked as such', format: 'Text' },
        { name: 'Comparison table and paper cards', detail: 'Your words, paper by paper', format: 'CSV' },
        { name: 'Writing record', detail: 'What you typed and what came from AI, per version', format: 'Text' },
        { name: 'AI-use statement', detail: 'Which AI helped, for what, on which days; never your text', format: 'Text' }
      ]
    };
  }
}
</script>
</body>
</html>
